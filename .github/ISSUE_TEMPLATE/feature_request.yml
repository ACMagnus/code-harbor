name: 社区功能建议
description: 提议版块、活动、网站功能或规则改进
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        也欢迎直接在 [Ideas 讨论区](https://github.com/ACMagnus/code-harbor/discussions/categories/ideas) 发帖；需要跟踪的改动再开 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 场景
      placeholder: 例如：新人不知道从哪里开始，资源库太散...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的改变
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues 和 Discussions，没有重复
          required: true
        - label: 这个建议与编程学习、开源协作或社区治理有关
          required: true
